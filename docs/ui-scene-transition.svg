<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8998"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" font-weight="700" fill="#17202b">씬 전환 시 스택 처리</text>
  <text x="40" y="58" font-size="12" fill="#637182">뷰마다 소유 씬을 기록해 둔다. 씬이 내려가면 그 씬이 소유한 것만 정확히 걷어낸다.</text>

  <!-- ================= panel A ================= -->
  <rect x="40" y="92" width="250" height="300" rx="10" fill="#f8fafc" stroke="#dbe2ea"/>
  <text x="56" y="118" font-size="12.5" font-weight="700" fill="#2c3b4d">① 전환 전 — Lobby 활성</text>
  <text x="56" y="136" font-size="10.5" fill="#8a97a6">스택 3장</text>

  <rect x="56" y="152" width="218" height="36" rx="6" fill="#fdeeeb" stroke="#d38b7e"/>
  <text x="68" y="167" font-size="11.5" font-weight="700" fill="#7d3729">SettingsPopup</text>
  <text x="68" y="180" font-size="9.5" fill="#a2705f">Popup · 2001 · 프리팹에서 열림</text>

  <rect x="56" y="196" width="218" height="36" rx="6" fill="#f3eefa" stroke="#9c88bf"/>
  <text x="68" y="211" font-size="11.5" font-weight="700" fill="#4a3670">ShopWindow</text>
  <text x="68" y="224" font-size="9.5" fill="#7d68a5">Window · 1000 · 프리팹에서 열림</text>

  <rect x="56" y="240" width="218" height="36" rx="6" fill="#f2f6e8" stroke="#93a66b"/>
  <text x="68" y="255" font-size="11.5" font-weight="700" fill="#455227">LobbyScreen</text>
  <text x="68" y="268" font-size="9.5" fill="#7a8a53">Screen · 0 · 씬 소유</text>

  <text x="56" y="308" font-size="10.5" fill="#6b7a8a">셋 다 OwnerScene = Lobby</text>
  <text x="56" y="326" font-size="10.5" fill="#8a97a6">프리팹 뷰는 열 당시 활성 씬을</text>
  <text x="56" y="342" font-size="10.5" fill="#8a97a6">소유자로 기록한다.</text>

  <line x1="296" y1="242" x2="318" y2="242" stroke="#7b8998" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ================= panel B ================= -->
  <rect x="325" y="92" width="250" height="300" rx="10" fill="#f8fafc" stroke="#dbe2ea"/>
  <text x="341" y="118" font-size="12.5" font-weight="700" fill="#2c3b4d">② sceneUnloaded(Lobby)</text>
  <text x="341" y="136" font-size="10.5" fill="#8a97a6">위에서부터 훑으며 소유 씬을 확인</text>

  <rect x="341" y="152" width="218" height="36" rx="6" fill="#f1f3f5" stroke="#ccd3db"/>
  <text x="353" y="167" font-size="11.5" font-weight="700" fill="#8b97a3">SettingsPopup</text>
  <text x="353" y="180" font-size="9.5" fill="#9aa5b1">구간 반납 → 풀 또는 Destroy</text>
  <text x="545" y="175" font-size="13" font-weight="700" fill="#b04a3a" text-anchor="end">✕</text>

  <rect x="341" y="196" width="218" height="36" rx="6" fill="#f1f3f5" stroke="#ccd3db"/>
  <text x="353" y="211" font-size="11.5" font-weight="700" fill="#8b97a3">ShopWindow</text>
  <text x="353" y="224" font-size="9.5" fill="#9aa5b1">구간 반납 → 풀 또는 Destroy</text>
  <text x="545" y="219" font-size="13" font-weight="700" fill="#b04a3a" text-anchor="end">✕</text>

  <rect x="341" y="240" width="218" height="36" rx="6" fill="#f1f3f5" stroke="#ccd3db"/>
  <text x="353" y="255" font-size="11.5" font-weight="700" fill="#8b97a3">LobbyScreen</text>
  <text x="353" y="268" font-size="9.5" fill="#9aa5b1">구간 반납 → Destroy (씬 소유)</text>
  <text x="545" y="263" font-size="13" font-weight="700" fill="#b04a3a" text-anchor="end">✕</text>

  <text x="341" y="308" font-size="10.5" fill="#6b7a8a">스택이 비고 레이어 커서가</text>
  <text x="341" y="324" font-size="10.5" fill="#6b7a8a">원위치된다.</text>
  <text x="341" y="346" font-size="10.5" fill="#8a97a6">이미 파괴된 참조도 함께 걷힌다.</text>

  <line x1="581" y1="242" x2="603" y2="242" stroke="#7b8998" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ================= panel C ================= -->
  <rect x="610" y="92" width="250" height="300" rx="10" fill="#f8fafc" stroke="#dbe2ea"/>
  <text x="626" y="118" font-size="12.5" font-weight="700" fill="#2c3b4d">③ sceneLoaded(Battle)</text>
  <text x="626" y="136" font-size="10.5" fill="#8a97a6">씬의 UIBase 를 스캔해 편입</text>

  <rect x="626" y="152" width="218" height="36" rx="6" fill="#f2f6e8" stroke="#93a66b"/>
  <text x="638" y="167" font-size="11.5" font-weight="700" fill="#455227">BattleScreen</text>
  <text x="638" y="180" font-size="9.5" fill="#7a8a53">Screen · 0 · 씬 소유 · 자동 Adopt</text>

  <text x="626" y="218" font-size="10.5" fill="#6b7a8a">디자이너가 저작한 Canvas 순서</text>
  <text x="626" y="234" font-size="10.5" fill="#6b7a8a">대로 아래에서부터 넣는다.</text>
  <text x="626" y="262" font-size="10.5" fill="#8a97a6">씬마다 등록 컴포넌트를 붙일</text>
  <text x="626" y="278" font-size="10.5" fill="#8a97a6">필요가 없다.</text>

  <!-- ================= additive band ================= -->
  <line x1="40" y1="418" x2="860" y2="418" stroke="#e3e8ee" stroke-width="1"/>
  <text x="40" y="444" font-size="12" font-weight="700" fill="#2c3b4d">Additive 로 겹친 씬을 내릴 때 — Battle 소유만 빠지고 Lobby 것은 그대로 남는다</text>

  <rect x="40" y="460" width="130" height="34" rx="6" fill="#f1f3f5" stroke="#ccd3db"/>
  <text x="52" y="475" font-size="10.5" font-weight="700" fill="#8b97a3">BattlePopup</text>
  <text x="52" y="487" font-size="9" fill="#9aa5b1">Battle 소유</text>
  <text x="160" y="481" font-size="12" font-weight="700" fill="#b04a3a" text-anchor="end">✕</text>

  <rect x="180" y="460" width="130" height="34" rx="6" fill="#f1f3f5" stroke="#ccd3db"/>
  <text x="192" y="475" font-size="10.5" font-weight="700" fill="#8b97a3">BattleScreen</text>
  <text x="192" y="487" font-size="9" fill="#9aa5b1">Battle 소유</text>
  <text x="300" y="481" font-size="12" font-weight="700" fill="#b04a3a" text-anchor="end">✕</text>

  <rect x="320" y="460" width="130" height="34" rx="6" fill="#eef6f0" stroke="#7fb094"/>
  <text x="332" y="475" font-size="10.5" font-weight="700" fill="#2f5f45">ShopWindow</text>
  <text x="332" y="487" font-size="9" fill="#5c8a72">Lobby 소유</text>
  <text x="440" y="481" font-size="12" font-weight="700" fill="#3d8a5f" text-anchor="end">✓</text>

  <rect x="460" y="460" width="130" height="34" rx="6" fill="#eef6f0" stroke="#7fb094"/>
  <text x="472" y="475" font-size="10.5" font-weight="700" fill="#2f5f45">LobbyScreen</text>
  <text x="472" y="487" font-size="9" fill="#5c8a72">Lobby 소유</text>
  <text x="580" y="481" font-size="12" font-weight="700" fill="#3d8a5f" text-anchor="end">✓</text>

  <text x="614" y="475" font-size="10.5" fill="#8a97a6">✕ 스택에서 제거 · 정렬 구간 반납</text>
  <text x="614" y="490" font-size="10.5" fill="#8a97a6">✓ 그대로 유지</text>
</svg>
